<!doctype html><html lang="zh"><meta charset="utf-8"><title>首次出征 · 台词落点</title>
<style>body{max-width:1200px;margin:28px auto;background:#101923;color:#e3ede8;font:16px system-ui;padding:0 15px}h1{color:#ebcc93}select,input{font:inherit;max-width:100%;padding:5px;background:#20303c;color:white}svg{background:#182832;width:100%;height:42vh}pre{white-space:pre-wrap;max-height:28vh;overflow:auto}p{line-height:1.6}</style>
<h1>首次出征 · 台词落点</h1><p>选择走法与台词，查看字幕送达时玩家的脚下位置。线为俯视轨迹，圆点为字幕事件；楼层高度见明细。数据包括死亡与超时。</p><label>测试组 <select id="co"></select></label> <label>走法 <select id="pr"></select></label> <label>按字筛选 <input id="q"></label> <label><input type="checkbox" id="zero">只看零命中</label><p><select id="ln" aria-label="选择台词"></select></p><b id="stats"></b><svg id="map" aria-label="世界 XZ 俯视图"></svg><pre id="detail"></pre>
<script>const d=/*DATA*/;const $=s=>document.getElementById(s),uniq=a=>[...new Set(a)],opt=(el,vals)=>el.replaceChildren(...vals.map(([v,s])=>new Option(s,v)));const co=$('co'),pr=$('pr'),ln=$('ln');opt(co,uniq(d.cases.map(c=>c.cohort)).map(x=>[x,x]));co.value='类人策略';function profiles(){opt(pr,['全部',...uniq(d.cases.filter(c=>c.cohort===co.value).map(c=>c.profile))].map(x=>[x,x]));lines()}function lines(){let old=ln.value;opt(ln,d.rates.filter(r=>r.cohort===co.value&&r.profile===pr.value&&r.line.includes($('q').value)&&(!$('zero').checked||!r.heard)).sort((a,b)=>b.heard-a.heard||a.line.localeCompare(b.line)).map(r=>[r.line,`${r.heard}/${r.runs}　${r.line}`]));if([...ln.options].some(o=>o.value===old))ln.value=old;draw()}function draw(){let c=d.cases.filter(c=>c.cohort===co.value&&(pr.value==='全部'||pr.value===c.profile)),ids=new Set(c.map(c=>c.case)),h=d.hits.filter(h=>ids.has(h.case)&&h.line===ln.value),r=d.rates.find(r=>r.line===ln.value&&r.cohort===co.value&&r.profile===pr.value),m=$('map');m.replaceChildren();$('stats').textContent=r?`听到 ${r.heard}/${r.runs} 局（${r.pct}%） · 共 ${r.events} 次`+(r.reached===null?'':` · 路过该区并在区内听到 ${r.local}/${r.reached} 局`):'没有符合筛选的台词';let bounds=[Infinity,Infinity,-Infinity,-Infinity];for(let run of c)for(let [x,z] of run.path){bounds=[Math.min(bounds[0],x),Math.min(bounds[1],z),Math.max(bounds[2],x),Math.max(bounds[3],z)]}m.setAttribute('viewBox',[bounds[0]-2,bounds[1]-2,bounds[2]-bounds[0]+4,bounds[3]-bounds[1]+4].join(' '));function svg(tag,attrs,parent=m){let e=document.createElementNS('http://www.w3.org/2000/svg',tag);for(let [k,v] of Object.entries(attrs))e.setAttribute(k,v);parent.append(e);return e}for(let run of c)svg('polyline',{points:run.path.map(p=>p.join(',')).join(' '),fill:'none',stroke:'#a4c2bb','stroke-width':.11,opacity:.24});let rows=h.map(a=>`${a.case}　tick ${a.tick}　XYZ (${[a.x,a.y,a.z].map(n=>n.toFixed(3)).join(', ')})`);h.forEach((a,i)=>svg('title',{},svg('circle',{cx:a.x,cy:a.z,r:.35,fill:'#ffb648'})).textContent=rows[i]);$('detail').textContent=rows.join('\n')||'没有落点。'}co.onchange=profiles;pr.onchange=$('zero').onchange=$('q').oninput=lines;ln.onchange=draw;profiles();</script></html>
