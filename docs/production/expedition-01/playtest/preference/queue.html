<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第一次出征 · 对照放映室</title>
<style>*{box-sizing:border-box}body{max-width:1520px;margin:24px auto;padding:0 20px;font:16px/1.55 system-ui,sans-serif;background:#152023;color:#edf1ea}h1,h2,p{margin:.4em 0}h2{font-size:1.25em}small,summary{color:#bfd3ca}video,img{display:block;width:100%;max-height:78vh;object-fit:contain;background:#101516}button,input{font:inherit;padding:.45em .75em;background:#293b3c;border:1px solid #708781;border-radius:5px;color:inherit;margin:3px}button{cursor:pointer}button:hover{background:#385351}input{width:min(96%,35em)}details{margin:1.2em 0}#err{color:#ffc988}#player{margin:.65em 0}fieldset{border:0;padding:0;margin:.5em 0}legend{font-size:.86em;color:#bfd3ca}</style>
<small>第一次出征 ／ 关卡设计校准</small><h1>对照放映室</h1><p id="summary"></p><h2 id="question"></h2><div id="player"></div><section id="form" hidden><input id="note" maxlength="600" aria-label="备注" placeholder="可选：哪一处影响了判断？"><fieldset><legend>场景判断</legend><span id="prefs"></span></fieldset><fieldset><legend>材料或方案需要调整 · 单独记录</legend><span id="quality"></span></fieldset></section><p id="err" role="alert"></p><details><summary>回看已判材料与记录</summary><p id="score"></p><ol id="ledger"></ol><div id="replay"></div></details>
<script>
const el=x=>document.getElementById(x), names={A:'左侧较好',B:'右侧较好',tie:'两版都可用',unclear:'看不清差别',rework:'两版都要返工',skip:'暂时跳过'};let id,locked=false;
function inspectFrame(m,where){
  const tools=document.createElement('div'),detail=document.createElement('div');
  // Both sides come from the same paused decoded video frame. Keep native controls for seeking.
  for(const [side,name] of [[0,'放大左侧当前帧'],[1,'放大右侧当前帧']]){
    let b=document.createElement('button');b.textContent=name;b.disabled=true;
    m.addEventListener('loadeddata',()=>b.disabled=false);
    b.onclick=()=>{m.pause();let w=Math.floor(m.videoWidth/2),h=m.videoHeight,canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;canvas.style.cssText='display:block;width:100%;max-height:78vh;object-fit:contain';canvas.getContext('2d').drawImage(m,side*w,0,w,h,0,0,w,h);let label=document.createElement('small');label.textContent=`${side?'右':'左'}侧 · ${m.currentTime.toFixed(2)} 秒`;detail.replaceChildren(label,canvas)};tools.append(b)
  }
  for(const event of ['seeking','play'])m.addEventListener(event,()=>detail.replaceChildren());where.append(tools,detail)
}
function show(where,tid,movie,title){let m=document.createElement(movie?'video':'img');if(movie){m.controls=true;m.playsInline=true;m.preload='metadata'}else m.alt=title;m.src='/media/'+encodeURIComponent(tid);where.replaceChildren(m);if(movie)inspectFrame(m,where)}
for(const [v,t] of Object.entries(names)){let b=document.createElement('button');b.textContent=t;b.onclick=async()=>{if(locked)return;locked=true;el('err').textContent='';try{let r=await fetch('/vote',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,choice:v,note:el('note').value})});if(!r.ok)throw Error(await r.text());el('note').value='';await load()}catch(e){el('err').textContent=String(e)}finally{locked=false}};el(['A','B','tie'].includes(v)?'prefs':'quality').append(b)}
async function load(){let r=await fetch('/state',{cache:'no-store'});if(!r.ok)throw Error(await r.text());const {card,report:s}=await r.json();el('summary').textContent=`布局判断 ${s.labels} 条 · 看不清差别 ${s.quality.unclear} 条 · 两版返工 ${s.quality.rework} 条 · 跳过 ${s.skipped} 条`;el('score').textContent=`有事前预测 ${s.prospective} 条，新家族盲测 ${s.transfer} 条；预测损失 ${s.prospective_loss??'—'}，基线 ${s.baseline??'—'}。`;el('ledger').replaceChildren(...s.history.map(h=>{let li=document.createElement('li'),b=document.createElement('button');b.textContent='回看';b.onclick=()=>show(el('replay'),h.id,h.movie,h.question);li.append(`${h.question}　${names[h.choice]}　${h.note||''}`,b);return li}));el('player').replaceChildren();el('form').hidden=!card;if(!card){el('question').textContent='本批材料已看完。可以在下方回看。';return}id=card.id;el('question').textContent=card.question;show(el('player'),id,card.media.endsWith('.mp4'),card.question)}load().catch(e=>el('err').textContent=String(e));</script></html>
