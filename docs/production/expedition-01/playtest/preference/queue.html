<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第一次出征 · 持续筛选台</title><style>*{box-sizing:border-box}body{max-width:1420px;margin:20px auto;padding:0 18px;font:16px/1.55 system-ui,sans-serif;background:#141e21;color:#eef4ee}h1{margin:.3em 0}small{color:#b8d2cd}img,video{display:block;width:100%;margin:.65em 0}button,input{font:inherit;padding:.5em .8em;background:#28383a;border:1px solid #627975;border-radius:4px;color:inherit;margin:3px}button{cursor:pointer}button:hover{background:#385351}input{width:min(95%,34em)}details{margin:1em 0}p{margin:.4em 0}#err{color:#ffc988}</style><small>第一次出征 ／ 本机人工校准</small><h1>持续筛选台</h1><p id="summary"></p><h2 id="question"></h2><div id="media"></div><section id="form"><input id="note" maxlength="600" placeholder="可选：哪一处影响了这次选择？"><div id="buttons"></div></section><p id="err" role="alert"></p><details><summary>已记录的判断与预测检验</summary><p id="score"></p><ol id="ledger"></ol></details><script>
let id,locked=false;const el=x=>document.getElementById(x);for(const [v,t] of [['A','左边'],['B','右边'],['tie','都可以'],['skip','跳过／证据不足']]){let b=document.createElement('button');b.textContent=t;b.onclick=async()=>{if(locked)return;locked=true;try{let r=await fetch('/vote',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,choice:v,note:el('note').value})});if(!r.ok)throw Error(await r.text());el('note').value='';await load()}catch(e){el('err').textContent=String(e)}finally{locked=false}};el('buttons').append(b)}async function load(){let r=await fetch('/state');if(!r.ok)throw Error(await r.text());const {card,report:s}=await r.json();el('err').textContent='';el('summary').textContent=`已收 ${s.labels} 条人工判断 · ${s.prospective} 条有事前预测 · 新家族盲测 ${s.transfer} 条。当前由人裁决。`;el('score').textContent=`预测损失：${s.prospective_loss??'待投票'}；同批基线：${s.baseline??'待投票'}（越小越好）。跳过 ${s.skipped} 对。`;el('ledger').replaceChildren(...s.history.map(h=>{let li=document.createElement('li');li.textContent=`${h.id}　${({A:'左',B:'右',tie:'都可以',skip:'跳过'})[h.choice]}　${h.note??''}`;return li}));el('media').replaceChildren();el('form').hidden=!card;if(!card){el('question').textContent='本批已筛完，等待新候选。';return}id=card.id;el('question').textContent=card.question;let m=document.createElement(card.media.endsWith('.mp4')?'video':'img');if(m.tagName==='VIDEO')m.controls=true;else m.alt=card.question;m.src='/media/'+encodeURIComponent(id);el('media').append(m)}load().catch(e=>el('err').textContent=String(e))</script></html>
